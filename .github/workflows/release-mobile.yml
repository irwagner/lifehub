name: Build Mobile (Android APK & iOS IPA)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Build full LifeHub app & sync Capacitor Android
        run: |
          pnpm run build
          npx cap sync android

      - name: Build & sign Android APK + AAB (Play Store ready)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          KS_ABS="$PWD/lifehub-release.keystore"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS_ABS"
            export LIFEHUB_KEYSTORE_FILE="$KS_ABS"
            export LIFEHUB_KEYSTORE_PASS="$ANDROID_KEYSTORE_PASS"
            export LIFEHUB_KEY_ALIAS="$ANDROID_KEY_ALIAS"
            export LIFEHUB_KEY_PASS="$ANDROID_KEY_PASS"
          else
            keytool -genkeypair -v \
              -keystore "$KS_ABS" \
              -storetype PKCS12 \
              -alias lifehub_release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass lifehub2026 -keypass lifehub2026 \
              -dname "CN=LifeHub, OU=Mobile, O=LifeHub, L=SaoPaulo, ST=SP, C=BR"
            export LIFEHUB_KEYSTORE_FILE="$KS_ABS"
            export LIFEHUB_KEYSTORE_PASS="lifehub2026"
            export LIFEHUB_KEY_ALIAS="lifehub_release"
            export LIFEHUB_KEY_PASS="lifehub2026"
          fi

          ./gradlew assembleRelease bundleRelease
          APK_OUT=$(find app/build/outputs/apk/release -name "app-release.apk" | head -n 1)
          if [ -z "$APK_OUT" ]; then
            APK_OUT=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          AAB_OUT=$(find app/build/outputs/bundle/release -name "app-release.aab" | head -n 1)
          if [ -z "$AAB_OUT" ]; then
            AAB_OUT=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          fi
          echo "Built signed APK: $APK_OUT"
          echo "Built signed AAB: $AAB_OUT"
          mkdir -p "$GITHUB_WORKSPACE/dist-mobile-release"
          cp "$APK_OUT" "$GITHUB_WORKSPACE/dist-mobile-release/LifeHub-Android.apk"
          cp "$AAB_OUT" "$GITHUB_WORKSPACE/dist-mobile-release/LifeHub-Android.aab"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -c -p 4 "$GITHUB_WORKSPACE/dist-mobile-release/LifeHub-Android.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 24 "$GITHUB_WORKSPACE/dist-mobile-release/LifeHub-Android.apk"
          jarsigner -verify "$GITHUB_WORKSPACE/dist-mobile-release/LifeHub-Android.aab"
          rm -f "$KS_ABS"
          ls -lh "$GITHUB_WORKSPACE/dist-mobile-release/LifeHub-Android.apk" "$GITHUB_WORKSPACE/dist-mobile-release/LifeHub-Android.aab"

      - name: Upload Android APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LifeHub-Android-Artifacts
          path: |
            dist-mobile-release/LifeHub-Android.apk
            dist-mobile-release/LifeHub-Android.aab

  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Build full LifeHub app & sync Capacitor iOS
        run: |
          pnpm run build
          npx cap sync ios

      - name: Compile iOS App with Xcode & package .ipa
        shell: bash
        run: |
          set -euo pipefail
          cd ios/App
          if [ -f Podfile ]; then
            pod install --repo-update
          fi

          mkdir -p build "$GITHUB_WORKSPACE/dist-mobile-release"

          if [ -d App.xcworkspace ]; then
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              build
          else
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              build
          fi

          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 2 -name "*.app" | head -n 1)
          echo "Built iOS app: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -r -y "$GITHUB_WORKSPACE/dist-mobile-release/LifeHub-iOS.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/dist-mobile-release/LifeHub-iOS.ipa"

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeHub-iOS-IPA
          path: dist-mobile-release/LifeHub-iOS.ipa

  publish-mobile-release:
    name: Attach APK, AAB & IPA to GitHub Release
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK & AAB
        uses: actions/download-artifact@v4
        with:
          name: LifeHub-Android-Artifacts
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: LifeHub-iOS-IPA
          path: release-assets

      - name: Publish Mobile Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/LifeHub-Android.apk
            release-assets/LifeHub-Android.aab
            release-assets/LifeHub-iOS.ipa
