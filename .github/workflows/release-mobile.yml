name: Build Mobile (Android APK & iOS IPA)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Build full LifeHub app & sync Capacitor Android
        run: |
          pnpm run build
          npx cap sync android

      - name: Build & sign Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          APK_IN=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: $APK_IN"
          mkdir -p "$GITHUB_WORKSPACE/dist-mobile-release"

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            KS_PASS="${{ secrets.ANDROID_KEYSTORE_PASS }}"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            KEY_PASS="${{ secrets.ANDROID_KEY_PASS }}"
          else
            keytool -genkey -v \
              -keystore release.keystore \
              -alias lifehub \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass lifehub2026 -keypass lifehub2026 \
              -dname "CN=LifeHub, OU=Mobile, O=LifeHub, L=SaoPaulo, S=SP, C=BR"
            KS_PASS="lifehub2026"
            KEY_ALIAS="lifehub"
            KEY_PASS="lifehub2026"
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -f -v 4 "$APK_IN" "$GITHUB_WORKSPACE/dist-mobile-release/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$GITHUB_WORKSPACE/dist-mobile-release/LifeHub-Android.apk" \
            "$GITHUB_WORKSPACE/dist-mobile-release/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$GITHUB_WORKSPACE/dist-mobile-release/LifeHub-Android.apk"
          rm -f "$GITHUB_WORKSPACE/dist-mobile-release/aligned.apk" release.keystore
          ls -lh "$GITHUB_WORKSPACE/dist-mobile-release/LifeHub-Android.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeHub-Android-APK
          path: dist-mobile-release/LifeHub-Android.apk

  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Build full LifeHub app & sync Capacitor iOS
        run: |
          pnpm run build
          npx cap sync ios

      - name: Compile iOS App with Xcode & package .ipa
        shell: bash
        run: |
          set -euo pipefail
          cd ios/App
          if [ -f Podfile ]; then
            pod install --repo-update
          fi

          mkdir -p build "$GITHUB_WORKSPACE/dist-mobile-release"

          if [ -d App.xcworkspace ]; then
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              build
          else
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              build
          fi

          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 2 -name "*.app" | head -n 1)
          echo "Built iOS app: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -r -y "$GITHUB_WORKSPACE/dist-mobile-release/LifeHub-iOS.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/dist-mobile-release/LifeHub-iOS.ipa"

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeHub-iOS-IPA
          path: dist-mobile-release/LifeHub-iOS.ipa

  publish-mobile-release:
    name: Attach APK & IPA to GitHub Release
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: LifeHub-Android-APK
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: LifeHub-iOS-IPA
          path: release-assets

      - name: Publish Mobile Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/LifeHub-Android.apk
            release-assets/LifeHub-iOS.ipa
