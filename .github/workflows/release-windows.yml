name: Release Windows (Auto-Update)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Run typecheck and tests
        run: |
          pnpm run typecheck
          pnpm run test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows portable + installer
        run: pnpm run tauri:build

      - name: Prepare release binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item -Force src-tauri\target\release\lifehub.exe dist-release\LifeHub.exe
          $setup = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          if ($setup) { Copy-Item -Force $setup.FullName dist-release\LifeHub-Instalador-Windows.exe }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/LifeHub.exe
            dist-release/LifeHub-Instalador-Windows.exe
