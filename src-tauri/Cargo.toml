[package]
name = "lifehub"
version = "0.4.1"
description = "LifeHub — Central de Vida (local-first desktop app for Windows)"
authors = ["LifeHub"]
edition = "2021"

[lib]
name = "lifehub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
